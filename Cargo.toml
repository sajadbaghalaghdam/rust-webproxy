[package]
name = "webproxy"
version = "0.1.0"
edition = "2021"
rust-version = "1.87"
description = "End-to-end encrypted HTTP tunnel (client/server) that keeps traffic opaque to CDNs"
license = "MIT"

[[bin]]
name = "webproxy"
path = "src/main.rs"

[features]
# Opt-in allocator. Measured on Windows it reserves ~10x more memory than the system
# allocator for the same throughput, so it is off by default.
mimalloc = ["dep:mimalloc"]

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "signal", "sync", "io-util"] }
hyper = { version = "1", features = ["http1", "http2", "server", "client"] }
hyper-util = { version = "0.1", features = ["tokio", "server", "server-auto", "client-legacy", "http1", "http2"] }
http = "1"
http-body = "1"
http-body-util = "0.1"
bytes = "1"
ring = "0.17"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-pki-types = { version = "1", features = ["std"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
hyper-rustls = { version = "0.27", default-features = false, features = ["http1", "http2", "ring", "tls12", "logging"] }
webpki-roots = "1"
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
base64 = "0.22"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
mimalloc = { version = "0.1", default-features = false, optional = true }
parking_lot = "0.12"
socket2 = { version = "0.6", features = ["all"] }
zeroize = "1"
tower-service = "0.3"

[target.'cfg(unix)'.dependencies]
rlimit = "0.10"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
debug = false
strip = true

[dev-dependencies]
tokio = { version = "1", features = ["test-util", "macros", "rt"] }
